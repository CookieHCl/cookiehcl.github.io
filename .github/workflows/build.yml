name: Build and Check

on:
  push:
    branches: [ main ] # Adjust branches as needed
  pull_request:
    branches: [ main ] # Adjust branches as needed
  workflow_dispatch: # allow manual re-deploys from the Actions tab

# Supersede queued PR runs, but never cancel a main run: cancelling mid-deploy
# can leave the site half-published.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    name: Astro Check
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup nub
        uses: nubjs/setup-nub@v0
        with:
          # https://github.com/nubjs/nub/issues/804
          nub-version: "0.7"

      - name: Install dependencies
        run: nub ci

      - name: Run Astro Check
        run: nub run check

  build:
    runs-on: ubuntu-latest
    name: Astro Build
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup nub
        uses: nubjs/setup-nub@v0
        with:
          # https://github.com/nubjs/nub/issues/804
          nub-version: "0.7"

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: nub ci

      - name: Run Astro Build
        run: nub run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    name: Deploy
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
